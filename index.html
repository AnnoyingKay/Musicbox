<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15120f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Musicbox">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Musicbox</title>
<style>
:root{--bg:#15120f;--card:#1f1b17;--line:#352e27;--txt:#f3ece3;--dim:#a39a8e;--acc:#e0a84b;--green:#1db954;--red:#e5604f;--on:#1b1408;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--head:var(--font);--radius:10px;--cover-r:6px;--tt:none;--ls:0;--img:none;--bevel:none;--hw:700;--orn:none;--cov:radial-gradient(circle,var(--bg) 0 9%,var(--line) 10% 34%,var(--bg) 35% 38%,var(--line) 39% 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background-color:var(--bg);background-image:var(--img);background-attachment:fixed;color:var(--txt);font:16px/1.4 var(--font)}
h1,h2,h3{font-family:var(--head);text-transform:var(--tt);letter-spacing:var(--ls);font-weight:var(--hw)}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.center h1{margin:0;font-size:34px}
.center p{margin:0;color:var(--dim);max-width:340px}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:var(--radius);padding:12px 18px;font-weight:600;min-height:44px;box-shadow:var(--bevel)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.green{background:var(--green);color:#04210e}
.btn.red{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn.small{padding:8px 12px;min-height:36px;font-size:14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row2{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}
.grow{flex:1;min-width:0}
h2{margin:0;font-size:22px}
h3{font-size:20px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;min-height:44px}
.row2 select{width:auto;min-height:38px;padding:6px 10px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
.note{color:var(--dim);font-size:13px;margin:6px 0}
.err{color:var(--red)}
code{background:var(--card);padding:2px 6px;border-radius:6px;word-break:break-all;font-size:13px}

/* ---------- header, tabs, main ---------- */
header.top{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;max-width:920px;margin:0 auto}
body.scrolled header.top{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:6px}
body.scrolled .hello,body.scrolled header.top::after{display:none}
body.scrolled header.top h2{font-size:1.05em}
.hello{color:var(--dim);font-size:13px;font-style:italic;margin-top:1px}
header.top::after{content:"";position:absolute;right:60px;top:calc(8px + env(safe-area-inset-top));width:96px;height:46px;background:var(--orn) no-repeat right center/contain;pointer-events:none;z-index:0}
header.top>*{position:relative;z-index:1}
main{padding:0 14px calc(96px + env(safe-area-inset-bottom));max-width:920px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:8}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dim);min-height:56px}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--on);font-size:30px;box-shadow:0 4px 14px #0008;z-index:7}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:12px;box-shadow:var(--bevel)}
.box>b:first-child,.box>h3:first-child{display:block;margin-bottom:4px}
.empty{color:var(--dim);text-align:center;padding:40px 10px}

/* ---------- today card and trophy strip ---------- */
.today{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:10px 12px;margin:6px 0 8px;position:relative}
.today p{margin:2px 0 0;color:var(--dim);font-size:14px}
.today p.note{margin:2px 0 0}
.tart{width:64px;height:40px;background:var(--orn) no-repeat center/contain;flex:none}
.ddx{background:transparent;border:0;color:var(--dim);font-size:22px;line-height:1;padding:4px 8px;align-self:flex-start}
.tstrip{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:2px 0 4px;min-height:44px}
.tmini{background:none;border:0;padding:0;flex:none;line-height:0}
.more{background:none;border:0;color:var(--acc);white-space:nowrap;padding:8px;flex:none}

/* ---------- library ---------- */
.ctl{position:sticky;top:var(--hh,0px);z-index:5;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.chip{border:1px solid var(--line);background:transparent;border-radius:calc(var(--radius)*4);padding:6px 12px;font-size:14px;white-space:nowrap;box-shadow:var(--bevel)}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 12px;min-height:38px}
.seg button.on{background:var(--acc);color:var(--on)}
.icon{background:transparent;border:1px solid var(--line);border-radius:var(--radius);width:44px;height:44px;font-size:20px;flex:none;box-shadow:var(--bevel)}
#lst{padding:2px 0}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.cov{width:56px;height:56px;border-radius:var(--cover-r);flex:none;object-fit:cover;background:var(--cov)}
.meta{flex:1;min-width:0}
.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--dim)}
.tag.ok{color:var(--green);border-color:var(--green)}
a.play{width:40px;height:40px;border-radius:50%;background:var(--green);color:#04210e;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:15px;flex:none}
#lst.covers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;padding-top:12px}
.tile{position:relative;cursor:pointer;min-width:0}
.tile .tc{width:100%;aspect-ratio:1;border-radius:var(--cover-r);object-fit:cover;display:block;background:var(--cov)}
.tile b{display:block;margin-top:6px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span.sub{display:block;color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile a.play{position:absolute;right:6px;top:6px;width:34px;height:34px;font-size:13px}
.tile .nl{position:absolute;left:6px;top:6px;background:var(--bg);opacity:.9;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--dim)}
#pgr{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:16px 0}
#pgr select{width:auto;min-height:36px;padding:4px 8px}

/* ---------- sheets (record form, welcome) ---------- */
#sheet{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end}
.panel{background:var(--bg);border-radius:calc(var(--radius)*1.6) calc(var(--radius)*1.6) 0 0;max-height:94vh;width:100%;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.panel h3{margin:0 0 4px}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.res{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px;margin-top:8px;box-shadow:var(--bevel)}
.res .cov{width:48px;height:48px}
.res .meta b{white-space:normal}
.best{color:var(--green);font-size:12px}
.wlist{margin:10px 0 0;padding:0;list-style:none}
.wlist li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.wlist li i{font-style:normal;color:var(--acc);font-weight:700;flex:none}

/* ---------- stats ---------- */
.stat{display:flex;gap:8px;flex-wrap:wrap}
.stat div{flex:1 1 84px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--dim)}
.hbar{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.hbar>span:first-child{width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .bar{flex:1;margin:0}
.bar{height:6px;background:var(--bg);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.months{display:flex;gap:4px;align-items:flex-end;height:112px;margin-top:6px}
.months div{flex:1;text-align:center;font-size:11px;color:var(--dim);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.months i{display:block;width:100%;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px}

/* ---------- trophies ---------- */
.trgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.tcell{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:var(--bevel)}
.tcell b{font-size:13px;line-height:1.2}
.tcell span{font-size:12px;color:var(--dim)}
.tcell.lock svg{filter:grayscale(1);opacity:.45}
.tov{position:fixed;inset:0;background:#000b;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--radius)*1.6);padding:20px;max-width:380px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.tcard h2{margin:8px 0 2px}
.tcard p{margin:6px 0}
.thead{color:var(--acc);font-size:13px;letter-spacing:1px;text-transform:uppercase}
.tmany{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.trow{display:flex;gap:8px;align-items:center;text-align:left;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.trow i{width:12px;height:12px;border-radius:50%;flex:none}
@keyframes pop{from{transform:scale(.82);opacity:0}to{transform:none;opacity:1}}
.tpop .tcard{animation:pop .35s ease-out}
@media(prefers-reduced-motion:reduce){.tpop .tcard{animation:none}}

/* ---------- theme picker ---------- */
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.theme{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--card);border-radius:var(--radius);padding:8px;text-align:left;min-height:48px;font-size:14px}
.theme.on{border-color:var(--acc)}
.sw{width:34px;height:34px;border-radius:50%;flex:none;position:relative;border:1px solid #8886;overflow:hidden;display:block}
.sw i{position:absolute;inset:9px;border-radius:50%;display:block}
[data-theme=eclectic] .item{border-left:4px solid hsl(var(--h,30) 70% 55%);padding-left:10px}
[data-theme=eclectic] div.cov,[data-theme=eclectic] div.tc{background:radial-gradient(circle,var(--bg) 0 9%,hsl(var(--h,30) 62% 62%) 10% 34%,var(--bg) 35% 38%,hsl(var(--h,30) 62% 62%) 39% 100%)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:var(--radius);z-index:40;max-width:90vw;text-align:center}

/* ====== Wider screens. Phones keep the layout above. ====== */
/* tablet */
@media (min-width:760px){
  header.top,main{padding-left:24px;padding-right:24px}
  header.top::after{right:76px;width:120px;height:56px}
  #lst.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:12px}
  #lst.list .item{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--bevel)}
  #lst.covers{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 14px}
  .trgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  html[data-tab=stats] main,html[data-tab=settings] main{column-count:2;column-gap:14px}
  html[data-tab=stats] main>*,html[data-tab=settings] main>*{break-inside:avoid;min-width:0}
  #sheet{align-items:center;justify-content:center}
  .panel{max-width:620px;border-radius:calc(var(--radius)*1.6);max-height:90vh;border:1px solid var(--line)}
  #toast{bottom:calc(110px + env(safe-area-inset-bottom))}
}
/* laptop: tab bar moves to the side, three columns, record form slides in from the right */
@media (min-width:1100px){
  body{padding-left:92px}
  header.top,main{max-width:1120px}
  nav.tabs{right:auto;top:0;bottom:0;width:92px;flex-direction:column;justify-content:flex-start;gap:6px;padding:18px 0 0;border-top:0;border-right:1px solid var(--line)}
  nav.tabs button{flex:0 0 auto;padding:12px 4px;margin:0 8px;border-radius:var(--radius)}
  nav.tabs button.on{background:var(--card)}
  .fab{right:28px;bottom:28px}
  main{padding-bottom:70px}
  #lst.list{grid-template-columns:repeat(3,minmax(0,1fr))}
  #lst.covers{grid-template-columns:repeat(6,minmax(0,1fr))}
  .trgrid{grid-template-columns:repeat(5,minmax(0,1fr))}
  #sheet{justify-content:flex-end;align-items:stretch;padding-left:92px}
  .panel{max-width:500px;max-height:100vh;height:100%;border-radius:calc(var(--radius)*1.6) 0 0 calc(var(--radius)*1.6)}
  #toast{bottom:28px}
}
@media (min-width:1500px){
  header.top,main{max-width:1320px}
  #lst.list{grid-template-columns:repeat(4,minmax(0,1fr))}
  #lst.covers{grid-template-columns:repeat(8,minmax(0,1fr))}
  .trgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
}
@media (max-width:370px){header.top::after{opacity:.35}}

.fab2{bottom:calc(140px + env(safe-area-inset-bottom));width:44px;height:44px;right:22px;background:var(--card);color:var(--txt);border:1px solid var(--line);font-size:0;display:flex;align-items:center;justify-content:center}
.fab2 svg,.bell svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);display:flex;align-items:center;justify-content:center;z-index:12;padding:0}
.bell b{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:var(--on);font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bell b:empty{display:none}
.scanbox{position:relative;border-radius:var(--radius);overflow:hidden;background:#000;aspect-ratio:4/3;margin:10px 0}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox i{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.spinc{text-align:center;padding:8px 0 4px}
.spinc .cov{width:168px;height:168px;margin:0 auto 12px;display:block}
.spinc h3{margin:0 0 4px}
@media (min-width:1100px){.fab2{right:38px;bottom:92px}.bell{right:24px}}
</style>
</head>
<body>


<div id="loading" class="center"><h1>Musicbox</h1><p>Loading</p></div>

<div id="login" class="center hide">
  <h1>Musicbox</h1>
  <p>Our record collection, linked to Spotify. Private to the two of us.</p>
  <button class="btn" id="btn-signin">Sign in with Google</button>
  <p id="login-err" class="err"></p>
</div>

<div id="denied" class="center hide">
  <h1>Not allowed yet</h1>
  <p>This account has no access to the collection. Send this account ID to the owner to be added.</p>
  <p><code id="denied-uid"></code></p>
  <button class="btn ghost" id="btn-copy-uid">Copy account ID</button>
  <button class="btn ghost" data-act="signout">Sign out</button>
</div>

<div id="app" class="hide">
  <header class="top"><div class="grow"><h2 id="title">Musicbox</h2><div class="hello" id="hello"></div></div></header>
  <main id="main"></main>
  <button class="fab" data-act="add" aria-label="Add a record">+</button>
  <button class="fab fab2" data-act="scan" aria-label="Scan a barcode"><svg viewBox="0 0 24 24"><path d="M4 7V5h2M18 5h2v2M20 17v2h-2M6 19H4v-2M8 8v8M11 8v8M14 8v8M17 8v8"/></svg></button>
  <button class="bell" id="bell" data-act="bell" aria-label="What your partner has added"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg><b id="bellN"></b></button>
  <nav class="tabs" id="tabs">
    <button data-tab="library" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>Library</button>
    <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Stats</button>
    <button data-tab="wish"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>Wishlist</button>
    <button data-tab="trophies"><svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 20h8"/></svg>Trophies</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
  </nav>
</div>

<div id="sheet" class="hide"><div class="panel" id="panel"></div></div>
<div id="tdet" class="tov hide"></div>
<div id="tpop" class="tov tpop hide"></div>
<div id="toast" class="hide"></div>

<script type="module">
/* ====================================================================
   SETTINGS. The only thing you need to change is the Spotify client ID.
   ==================================================================== */
const SPOTIFY_CLIENT_ID = '499c789232a643b9867579610a1b9e70';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCgVHwUEbDsp_DiyAWbIaHW7b5LS7MRwNM",
  authDomain: "shelf-b5282.firebaseapp.com",
  projectId: "shelf-b5282",
  storageBucket: "shelf-b5282.firebasestorage.app",
  messagingSenderId: "137353564152",
  appId: "1:137353564152:web:5e78fb7a5d32cc5342d00d"
};
const FB_VER = '10.14.1';
const COLLECTION = 'vinyl';
/* ==================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ls = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
const lset = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const S = {
  user: null, recs: [], meta: null, recsReady: false, metaReady: false, started: false,
  tab: 'library', q: '', filter: 'all', sort: 'artist', view: ls('musicbox_view', 'list'), pp: +ls('musicbox_pp', '50') || 50, page: 0,
  draft: null, results: [], matching: false, stop: false, dq: null,
  wish: [], wishReady: false, wq: '', wd: null, fromWish: null, wsel: null
};

/* ---------- toast ---------- */
let toastT;
function toast(msg, ms = 3200) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hide');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hide'), ms);
}

/* ---------- text helpers ---------- */
function norm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\(.*?\)|\[.*?\]/g, ' ').replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim().replace(/^the /, '');
}
function cleanArtist(a) { return String(a || '').replace(/\s*\(\d+\)\s*$/, '').trim(); }

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x !== ''));
}

/* ---------- matching ---------- */
function scoreMatch(rec, a) {
  const t1 = norm(rec.title), t2 = norm(a.name);
  if (!t1 || !t2) return 0;
  const titleScore = t1 === t2 ? 2 : (t1.includes(t2) || t2.includes(t1)) ? 1 : 0;
  if (!titleScore) return 0;
  const ar = norm(rec.artist);
  let artistOk = !ar || ar === 'various' || ar === 'various artists';
  if (!artistOk) artistOk = a.artists.some(x => { const n = norm(x); return n && (n === ar || n.includes(ar) || ar.includes(n)); });
  return artistOk ? titleScore : 0;
}
function rank(rec, list) {
  return list.map(a => ({ ...a, score: scoreMatch(rec, a) }))
    .sort((x, y) => y.score - x.score || (x.type === 'album' ? 0 : 1) - (y.type === 'album' ? 0 : 1));
}

/* ====================================================================
   Spotify (PKCE sign in, no secret needed)
   ==================================================================== */
const SP = {
  redirect: location.origin + location.pathname.replace(/index\.html$/, ''),
  K: { tok: 'vinyl_sp_tok', ver: 'vinyl_sp_ver', state: 'vinyl_sp_state' },
  configured: () => !/PASTE/i.test(SPOTIFY_CLIENT_ID),
  tok() { try { return JSON.parse(localStorage.getItem(this.K.tok) || 'null'); } catch (e) { return null; } },
  save(t) { localStorage.setItem(this.K.tok, JSON.stringify(t)); },
  clear() { localStorage.removeItem(this.K.tok); }
};
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const rand = n => b64url(crypto.getRandomValues(new Uint8Array(n)));

async function spConnect() {
  if (!SP.configured()) { toast('Add the Spotify client ID at the top of index.html first'); return; }
  const ver = rand(48), state = rand(16);
  localStorage.setItem(SP.K.ver, ver); localStorage.setItem(SP.K.state, state);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ver)));
  const u = new URL('https://accounts.spotify.com/authorize');
  u.search = new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, response_type: 'code', redirect_uri: SP.redirect, code_challenge_method: 'S256', code_challenge: challenge, state }).toString();
  location.href = u.toString();
}
async function spTokenRequest(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: SPOTIFY_CLIENT_ID, ...params }).toString()
  });
  if (!r.ok) throw new Error('token ' + r.status);
  return r.json();
}
async function spHandleRedirect() {
  const p = new URLSearchParams(location.search);
  if (!p.has('code') && !p.has('error')) return;
  const code = p.get('code'), state = p.get('state'), err = p.get('error');
  history.replaceState(null, '', location.pathname);
  if (err) { S.pendingToast = 'Spotify sign in was cancelled'; return; }
  if (!state || state !== localStorage.getItem(SP.K.state)) { S.pendingToast = 'Spotify sign in could not be verified'; return; }
  try {
    const j = await spTokenRequest({ grant_type: 'authorization_code', code, redirect_uri: SP.redirect, code_verifier: localStorage.getItem(SP.K.ver) || '' });
    SP.save({ access: j.access_token, refresh: j.refresh_token, exp: Date.now() + j.expires_in * 1000 });
    S.pendingToast = 'Spotify connected';
  } catch (e) { S.pendingToast = 'Spotify sign in failed'; }
  localStorage.removeItem(SP.K.ver); localStorage.removeItem(SP.K.state);
}
async function spToken(force) {
  const t = SP.tok(); if (!t) return null;
  if (!force && Date.now() < t.exp - 60000) return t.access;
  if (!t.refresh) { SP.clear(); return null; }
  try {
    const j = await spTokenRequest({ grant_type: 'refresh_token', refresh_token: t.refresh });
    const n = { access: j.access_token, refresh: j.refresh_token || t.refresh, exp: Date.now() + j.expires_in * 1000 };
    SP.save(n); return n.access;
  } catch (e) { SP.clear(); return null; }
}
async function spSearch(q) {
  let tk = await spToken(); if (!tk) throw new Error('NOSP');
  let refreshed = false;
  for (let i = 0; i < 4; i++) {
    const r = await fetch('https://api.spotify.com/v1/search?' + new URLSearchParams({ q, type: 'album', limit: '10' }), { headers: { Authorization: 'Bearer ' + tk } });
    if (r.status === 429) { await sleep((+r.headers.get('retry-after') || 2) * 1000 + 300); continue; }
    if (r.status === 401 && !refreshed) { refreshed = true; tk = await spToken(true); if (!tk) throw new Error('NOSP'); continue; }
    if (!r.ok) throw new Error('SP' + r.status);
    const j = await r.json();
    return ((j.albums && j.albums.items) || []).filter(Boolean).map(a => ({
      id: a.id, name: a.name || '', type: a.album_type || '',
      artists: (a.artists || []).map(x => x.name),
      year: String(a.release_date || '').slice(0, 4),
      cover: (a.images && (a.images[1] || a.images[0]) || {}).url || ''
    }));
  }
  throw new Error('SP429');
}
function spErrorText(e) {
  const m = e && e.message;
  if (m === 'NOSP') return 'Connect Spotify first (Settings).';
  if (m === 'SP403') return 'Spotify refused the request. Your Spotify account must be added under User Management in the Spotify developer dashboard, and the app owner needs Premium.';
  if (m === 'SP429') return 'Spotify is rate limiting. Try again in a minute.';
  return 'Spotify search failed. Check your connection and try again.';
}

   Firebase
   ==================================================================== */
let fb = null, unsubR = null, unsubM = null, unsubW = null;
async function fbInit() {
  const base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
  const [appM, authM, fsM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  const auth = authM.getAuth(app);
  let db;
  try { db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
  catch (e) { db = fsM.getFirestore(app); }
  fb = { auth, db, A: authM, F: fsM };
}
const col = () => fb.F.collection(fb.db, COLLECTION);
const ref = id => fb.F.doc(fb.db, COLLECTION, id);
const metaRef = () => fb.F.doc(fb.db, 'vinylMeta', 'household');
const wcol = () => fb.F.collection(fb.db, 'vinylMeta', 'household', 'wish');
const wref = id => fb.F.doc(fb.db, 'vinylMeta', 'household', 'wish', id);

function show(view) {
  for (const v of ['loading', 'login', 'denied', 'app']) $('#' + v).classList.toggle('hide', v !== view);
}
function stopListening() {
  if (unsubR) { unsubR(); unsubR = null; }
  if (unsubM) { unsubM(); unsubM = null; }
  if (unsubW) { unsubW(); unsubW = null; }
  S.wish = []; S.wishReady = false;
  S.recsReady = false; S.metaReady = false; S.meta = null; S.started = false;
}
function startListening() {
  stopListening();
  unsubR = fb.F.onSnapshot(col(), snap => {
    S.recs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.recsReady = true;
    if (!S.started) { S.started = true; show('app'); setTab(S.tab); welcomeCheck(); }
    else if (S.tab === 'library') refreshLibrary();
    else if (S.tab === 'wish') refreshWish();
    else renderTab();
    checkTrophies(); updateBell();
  }, err => {
    if (err && err.code === 'permission-denied') { $('#denied-uid').textContent = S.user.uid; show('denied'); }
    else { show('app'); toast('Could not load the collection'); }
  });
  unsubW = fb.F.onSnapshot(wcol(), snap => {
    S.wish = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.wishReady = true; S.wishFail = false;
    if (S.tab === 'wish') refreshWish();
  }, err => { S.wishFail = true; if (S.tab === 'wish') refreshWish(); });
  unsubM = fb.F.onSnapshot(metaRef(), snap => {
    S.meta = snap.exists() ? snap.data() : {}; S.metaReady = true; S.metaFail = false;
    checkTrophies(); fillStrip();
    if (S.tab === 'trophies') renderTrophies();
  }, err => { S.metaFail = true; S.meta = S.meta || {}; if (S.tab === 'trophies') renderTrophies(); });
}

function fieldHTML(k, label, v, type) {

}
function gradeHTML(k, label, v) {

      <button class="btn grow" data-act="save">Save</button>

    </div>`);
}
function collectDraft() {
  document.querySelectorAll('#panel [data-f]').forEach(el => { S.draft[el.dataset.f] = el.value.trim(); });
  S.draft.year = S.draft.year ? String(S.draft.year).slice(0, 4) : '';
  S.draft.copies = Math.max(1, parseInt(S.draft.copies, 10) || 1);
}
async function saveDraft() {
  collectDraft();
  const d = S.draft;
  if (!d.artist || !d.title) { toast('Artist and title are needed'); return; }
  const now = Date.now();
  const data = {
    artist: d.artist, title: d.title, year: d.year || '', copies: d.copies, label: d.label || '', catno: d.catno || '', barcode: d.barcode || '', country: d.country || '', genres: d.genres || '', format: d.format || '',
    pressing: d.pressing || '', mediaCond: d.mediaCond || '', sleeveCond: d.sleeveCond || '', notes: d.notes || '',
    spotifyId: d.spotifyId || '', spotifyName: d.spotifyName || '', spotifyArtist: d.spotifyArtist || '', cover: d.cover || '',
    discogsId: d.discogsId || '', updatedAt: now
  };
  try {
    if (d.id) await fb.F.updateDoc(ref(d.id), data);
    else {
      await fb.F.addDoc(col(), { ...data, addedAt: now, addedBy: S.user.email || '', addedByName: firstName() });
      if (S.fromWish) { try { await fb.F.deleteDoc(wref(S.fromWish)); } catch (e) {} }
    }
    closeSheet(); toast('Saved');
  } catch (e) { toast('Could not save. Check your connection.'); }
}
async function deleteDraft() {
  const d = S.draft; if (!d || !d.id) return;
  if (!confirm(`Delete "${d.title}" by ${d.artist}?`)) return;
  try { await fb.F.deleteDoc(ref(d.id)); closeSheet(); toast('Deleted'); } catch (e) { toast('Could not delete'); }
}

async function sheetSearch() {
  const q = ($('#sp-q').value || '').trim(); if (!q) return;
  const box = $('#sp-res'); box.innerHTML = '<div class="note">Searching</div>';
  try {
    collectDraft();
    const res = await spSearch(q);
    S.results = rank(S.draft, res);
    if (!S.results.length) { box.innerHTML = '<div class="note">No albums found. Try fewer words.</div>'; return; }
    box.innerHTML = S.results.map((a, i) => `
      <button class="res" data-pick="${i}">
        ${a.cover ? `<img class="cov" loading="lazy" referrerpolicy="no-referrer" src="${esc(a.cover)}" alt="">` : '<div class="cov"></div>'}
        <div class="meta"><b>${esc(a.name)}</b><span>${esc(a.artists.join(', '))}${a.year ? ' · ' + esc(a.year) : ''}${a.type && a.type !== 'album' ? ' · ' + esc(a.type) : ''}</span>${a.score === 2 && i === 0 ? '<span class="best">Best match</span>' : ''}</div>
      </button>`).join('');
  } catch (e) {
    box.innerHTML = `<div class="note err">${esc(spErrorText(e))}</div>` + (e.message === 'NOSP' ? '<button class="btn green small" data-act="sp-connect">Connect Spotify</button>' : '');
  }
}
async function pickResult(i) {
  const a = S.results[i]; if (!a) return;
  Object.assign(S.draft, { spotifyId: a.id, spotifyName: a.name, spotifyArtist: a.artists.join(', '), cover: a.cover });
  $('#sp-cur').innerHTML = spCurrentHTML(); $('#sp-res').innerHTML = ''; updateCoverPrev();
  if (S.draft.id) {
    try { await fb.F.updateDoc(ref(S.draft.id), { spotifyId: a.id, spotifyName: S.draft.spotifyName, spotifyArtist: S.draft.spotifyArtist, cover: a.cover, updatedAt: Date.now() }); toast('Linked'); }
    catch (e) { toast('Could not save the link'); }
  } else toast('Linked. Save the record to keep it.');
}
async function unlinkDraft() {
  Object.assign(S.draft, { spotifyId: '', spotifyName: '', spotifyArtist: '', cover: String(S.draft.cover || '').startsWith('data:') ? S.draft.cover : '' });
  $('#sp-cur').innerHTML = spCurrentHTML(); updateCoverPrev();
  if (S.draft.id) { try { await fb.F.updateDoc(ref(S.draft.id), { spotifyId: '', spotifyName: '', spotifyArtist: '', cover: String(S.draft.cover || '').startsWith('data:') ? S.draft.cover : '', updatedAt: Date.now() }); toast('Unlinked'); } catch (e) { toast('Could not unlink'); } }
}

async function importCSV(file) {
  const out = $('#imp'); out.textContent = 'Reading file';
  try {
    const rows = parseCSV(await file.text());
    if (rows.length < 2) { out.textContent = 'The file looks empty.'; return; }
    const head = rows[0].map(h => h.trim().toLowerCase());
    const ix = n => head.indexOf(n);
    const I = { artist: ix('artist'), title: ix('title'), label: ix('label'), cat: ix('catalog#'), fmt: ix('format'), rel: ix('released'), id: ix('release_id'), mc: ix('collection media condition'), sc: ix('collection sleeve condition'), notes: ix('collection notes') };
    if (I.artist < 0 || I.title < 0) { out.textContent = 'This does not look like a Discogs collection export (no Artist and Title columns).'; return; }
    const get = (r, i) => (i >= 0 && r[i] != null ? r[i].trim() : '');
    const byId = new Map(); let manual = 0;
    for (const r of rows.slice(1)) {
      const rid = get(r, I.id);
      const key = rid || 'x' + (manual++);
      if (byId.has(key)) { byId.get(key).copies++; continue; }
      const grade = v => GRADES.find(g => g && v && g.split(' (')[0].toLowerCase() === v.split(' (')[0].toLowerCase()) || '';
      byId.set(key, {
        artist: cleanArtist(get(r, I.artist)), title: get(r, I.title), year: (get(r, I.rel).match(/\d{4}/) || [''])[0],
        label: get(r, I.label), catno: get(r, I.cat), format: get(r, I.fmt), pressing: '',
        mediaCond: grade(get(r, I.mc)), sleeveCond: grade(get(r, I.sc)), notes: get(r, I.notes), copies: 1, discogsId: rid
      });
    }
    const have = new Set(S.recs.map(r => r.discogsId).filter(Boolean));
    const fresh = [...byId.values()].filter(x => x.artist && x.title && !(x.discogsId && have.has(x.discogsId)));
    if (!fresh.length) { out.textContent = 'Nothing new to import.'; return; }
    const now = Date.now(); let done = 0;
    for (let i = 0; i < fresh.length; i += 400) {
      const batch = fb.F.writeBatch(fb.db);
      fresh.slice(i, i + 400).forEach(x => {
        const id = x.discogsId ? 'd' + x.discogsId : undefined;
        const docRef = id ? ref(id) : fb.F.doc(col());
        batch.set(docRef, { ...x, spotifyId: '', spotifyName: '', spotifyArtist: '', cover: '', addedAt: now, updatedAt: now, addedBy: S.user.email || '', addedByName: firstName() });
      });
      await batch.commit(); done = Math.min(fresh.length, i + 400); out.textContent = `Imported ${done} of ${fresh.length}`;
    }
    out.textContent = `Imported ${fresh.length} records. Now use Match all to link them to Spotify.`;
  } catch (e) { out.textContent = 'Import failed. Check the file and your connection.'; }
}

async function fillFromDiscogs() {
  const todo = S.recs.filter(r => r.discogsId && !r.genres);
  if (!todo.length || !dTok()) return;
  S.stop = false; const p = () => $('#fill-prog'), st = $('#fill-stop'); if (st) st.classList.remove('hide');
  let n = 0, ok = 0, err = '';
  for (const r of todo) {
    if (S.stop) break; n++;
    if (p()) p().textContent = `Filling ${n} of ${todo.length}. Done ${ok}.`;
    try {
      const o = await discogsRelease(r.discogsId), u = { updatedAt: Date.now() };
      u.genres = o.genres || '-';
      if (o.country) u.country = o.country;
      for (const k of ['label', 'catno', 'pressing', 'year', 'cover']) if (!r[k] && o[k]) u[k] = o[k];
      await fb.F.updateDoc(ref(r.id), u); ok++;
    } catch (e) {
      if (e.message === 'HTTP429') { await sleep(30000); n--; continue; }
      if (e.message === 'HTTP401') { err = 'Discogs rejected the token.'; break; }
    }
    await sleep(1100);
  }
  if (p()) p().textContent = (err ? err + ' ' : '') + `Filled ${ok} of ${todo.length}.` + (S.stop ? ' Stopped.' : '');
  if (st) st.classList.add('hide');
}
async function matchAll() {
  const todo = S.recs.filter(r => !r.spotifyId);

  S.matching = true; S.stop = false;
  const prog = () => $('#prog'), bar = () => $('#bar');
  if ($('#match-stop')) $('#match-stop').classList.remove('hide');
  if (bar()) bar().classList.remove('hide');
  let linked = 0, n = 0, failed = '';
  for (const r of todo) {
    if (S.stop) break;
    n++;
    if (prog()) { prog().textContent = `Matching ${n} of ${todo.length}. Linked ${linked}.`; bar().firstElementChild.style.width = (n / todo.length * 100) + '%'; }
    try {
      const best = rank(r, await spSearch(`${r.artist} ${r.title}`))[0];
      if (best && best.score === 2) {
        await fb.F.updateDoc(ref(r.id), { spotifyId: best.id, spotifyName: best.name, spotifyArtist: best.artists.join(', '), cover: best.cover, updatedAt: Date.now() });

const TR = [
  { id: 'crate', n: 'The Crate', g: 'crate', u: 'records saved', t: [1, 10, 50, 150, 500], v: c => c.n },
  { id: 'tuned', n: 'Linked Up', g: 'link', u: 'records linked to Spotify', t: [1, 10, 50, 150, 500], v: c => c.linked },

const COLOUR_RE = /\b(clear|colou?red|red|blue|green|yellow|orange|pink|purple|violet|white|gold|silver|splatter|marbled?|translucent|transparent|picture disc|smoke|cloudy|swirl|neon|opaque|galaxy|bone|cream|grey|gray|brown|aqua|teal|magenta|lilac)\b/i;
function mkCtx(rs) {
  const yr = new Date().getFullYear();
  const c = { n: rs.length, linked: 0, colour: 0, doubles: 0, mint: 0, notes: 0, discogs: 0, old: 9999, fresh: 0, night: 0 };
  const artists = new Map(), labels = new Set(), decades = new Set(), perDay = new Map(), adders = new Map();
  for (const r of rs) {
    if (r.spotifyId) c.linked++;
    if (COLOUR_RE.test((r.pressing || '') + ' ' + (r.format || ''))) c.colour++;
    if ((+r.copies || 1) > 1) c.doubles++;
    if (/^(mint|near mint)/i.test(r.mediaCond || '')) c.mint++;
    if (r.notes) c.notes++;
    if (r.discogsId) c.discogs++;
    const y = +r.year;
    if (y >= 1900 && y <= yr + 1) { decades.add(Math.floor(y / 10) * 10); if (y < c.old) c.old = y; if (y === yr) c.fresh++; }
    const a = norm(r.artist); if (a) artists.set(a, (artists.get(a) || 0) + 1);
    const l = norm(r.label); if (l) labels.add(l);
    if (r.addedBy) adders.set(r.addedBy, (adders.get(r.addedBy) || 0) + 1);
    if (!r.discogsId && r.addedAt) {

  c.full = (c.n >= 10 && c.linked === c.n) ? 1 : 0;

}

    return { t, val, calc, lvl, when: Array.from({ length: lvl }, (_, i) => when[t.id + '_' + (i + 1)] || 0) };
  });
  return { items, c, by: Object.fromEntries(items.map(x => [x.t.id, x])) };
}

function checkTrophies() {
  if (!S.recsReady || !S.metaReady || awarding) return;
  const st = trophyState(), best = (S.meta && S.meta.best) || {};
  const fresh = st.items.filter(x => x.calc > (best[x.t.id] | 0));
  if (!fresh.length) return;
  const now = Date.now(), patch = { best: {}, when: {} };

    return norm([r.artist, r.title, r.label, r.catno, r.pressing, r.notes, r.genres, r.country].join(' ')).includes(q);

function renderStats() {

let scanStream = null, scanOn = false;

async function makeDetector() {
  if ('BarcodeDetector' in window) {
    try { return new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] }); } catch (e) {}
  }
  const Z = await import('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/+esm');
  const hints = new Map(); hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
  const rd = new Z.MultiFormatReader(); rd.setHints(hints);
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  return {
    detect: async el => {
      const w = el.videoWidth, h = el.videoHeight; if (!w) return [];
      cv.width = w; cv.height = h; cx.drawImage(el, 0, 0, w, h);
      const px = cx.getImageData(0, 0, w, h).data, lum = new Uint8ClampedArray(w * h);
      for (let i = 0; i < w * h; i++) lum[i] = (px[i * 4] * 299 + px[i * 4 + 1] * 587 + px[i * 4 + 2] * 114) / 1000;
      try { return [{ rawValue: rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(lum, w, h)))).getText() }]; } catch (e) { return []; }
    }
  };
}
async function startScan() {
  scanOn = true;
  try { scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }); }
  catch (e) { scanMsg('The camera is not available. Allow camera access, or type the numbers below.'); return; }
  const v = $('#scan-v'); if (!scanOn || !v) { stopScan(); return; }
  v.srcObject = scanStream; try { await v.play(); } catch (e) {}
  let det; try { det = await makeDetector(); } catch (e) { scanMsg('Scanning is not available here. Type the numbers below.'); return; }
  const tick = async () => {
    if (!scanOn) return;
    try { const r = await det.detect(v); if (r && r[0] && r[0].rawValue) { stopScan(); lookupBarcode(r[0].rawValue); return; } } catch (e) {}
    setTimeout(tick, 250);
  };
  tick();
}
const dTok = () => ls('musicbox_discogs_token', '');
const uniq = a => [...new Set(a.filter(Boolean))];
async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error('HTTP' + r.status); return r.json(); }
async function discogsLookup(codes) {
  const tk = dTok(); if (!tk) return null;
  let hit = null;
  for (const c of codes) {
    const j = await getJSON('https://api.discogs.com/database/search?' + new URLSearchParams({ barcode: c, type: 'release', per_page: '10', token: tk }));
    const list = j.results || [];
    hit = list.find(x => (x.format || []).includes('Vinyl')) || list[0];
    if (hit) break;
  }
  if (!hit) return null;
  return discogsRelease(hit.id);
}
async function discogsRelease(id) {
  const r = await getJSON('https://api.discogs.com/releases/' + id + '?token=' + encodeURIComponent(dTok()));
  const f = (r.formats || [])[0] || {}, l = (r.labels || [])[0] || {};
  return {
    discogsId: String(r.id),
    artist: uniq((r.artists || []).map(a => cleanArtist(a.name))).join(', '),
    title: r.title || '',
    year: String(r.year || (r.released || '').slice(0, 4) || ''),
    label: l.name ? cleanArtist(l.name) : '',
    catno: l.catno && l.catno !== 'none' ? l.catno : '',
    format: uniq([f.name].concat(f.descriptions || [])).join(', '),
    pressing: f.text || '',
    country: r.country || '',
    cover: ((r.images || []).find(i => i.type === 'primary') || (r.images || [])[0] || {}).uri || '',
    genres: uniq([].concat(r.genres || [], r.styles || [])).join(', ')
  };
}

const covPrevHTML = d => d.cover ? `<img class="cov" style="width:72px;height:72px" referrerpolicy="no-referrer" src="${esc(d.cover)}" alt="" onerror="this.style.visibility='hidden'">` : '<div class="cov" style="width:72px;height:72px"></div>';
function updateCoverPrev() { const p = $('#cov-prev'); if (p && S.draft) p.innerHTML = covPrevHTML(S.draft); }
async function photoToCover(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const side = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas'); c.width = c.height = 320;
    c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 320, 320);
    return c.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }

  stopScan();

  }
  closeSheet(); openRecord(null, pre);
  if (spHit) Object.assign(S.draft, { spotifyId: spHit.id, spotifyName: spHit.name, spotifyArtist: spHit.artists.join(', '), cover: spHit.cover });
  if (S.draft && S.draft.spotifyId) { const c = $('#sp-cur'); if (c) c.innerHTML = spCurrentHTML(); updateCoverPrev(); }
  toast(got.length ? 'Found in ' + got.join(' and ') + '. Check the details, then save.' : 'Nothing found for ' + code + (tried.length ? ' (' + tried.join(', ') + ')' : '') + '. Fill in by hand.', got.length ? 4000 : 7000);
  if (pre.artist && pre.title && SP.tok() && !(S.draft && S.draft.spotifyId)) {
    const d = S.draft;
    try {
      const best = rank(d, await spSearch(`${pre.artist} ${pre.title}`))[0];

/* ====================================================================
   Wishlist. Search an artist, get their albums, add what you want.
   ==================================================================== */
async function spGet(url, params) {
  let tk = await spToken(); if (!tk) throw new Error('NOSP');
  let refreshed = false;
  for (let i = 0; i < 4; i++) {
    const r = await fetch(url + '?' + new URLSearchParams(params), { headers: { Authorization: 'Bearer ' + tk } });
    if (r.status === 429) { await sleep((+r.headers.get('retry-after') || 2) * 1000 + 300); continue; }
    if (r.status === 401 && !refreshed) { refreshed = true; tk = await spToken(true); if (!tk) throw new Error('NOSP'); continue; }
    if (!r.ok) throw new Error('SP' + r.status);
    return r.json();
  }
  throw new Error('SP429');
}
async function wishFind(name) {
  const out = [], errs = [];
  const add = (n, src, id, x) => {
    const k = norm(n); if (!k) return;
    let c = out.find(o => o.key === k); if (!c) { c = { key: k, name: n, img: '', genres: '' }; out.push(c); }
    if (!c[src]) c[src] = String(id);
    if (x && x.img && !c.img) c.img = x.img;
    if (x && x.genres && !c.genres) c.genres = x.genres;
  };
  const jobs = [];
  if (SP.tok()) jobs.push(spGet('https://api.spotify.com/v1/search', { q: name, type: 'artist', limit: '6' })
    .then(j => ((j.artists && j.artists.items) || []).filter(Boolean).forEach(a => add(a.name, 'sp', a.id, { img: ((a.images || []).slice(-1)[0] || {}).url, genres: (a.genres || []).slice(0, 2).join(', ') })))
    .catch(e => errs.push('Spotify: ' + spErrorText(e))));
  if (dTok()) jobs.push(getJSON('https://api.discogs.com/database/search?' + new URLSearchParams({ q: name, type: 'artist', per_page: '6', token: dTok() }))
    .then(j => (j.results || []).forEach(a => add(cleanArtist(a.title), 'dc', a.id, { img: a.thumb })))
    .catch(e => errs.push(e.message === 'HTTP401' ? 'Discogs rejected the token' : 'Discogs search failed')));
  await Promise.all(jobs);
  const q = norm(name);
  out.sort((a, b) => (b.key === q) - (a.key === q) || ((b.sp ? 1 : 0) + (b.dc ? 1 : 0)) - ((a.sp ? 1 : 0) + (a.dc ? 1 : 0)));
  return { list: out, errs };
}
async function spAlbums(c) {
  const all = [];
  try {
    for (let p = 0; p < 10; p++) {
      const j = await spGet('https://api.spotify.com/v1/artists/' + c.sp + '/albums', { include_groups: 'album,single,compilation', limit: '10', offset: String(p * 10) });
      const it = (j.items || []).filter(Boolean); all.push(...it);
      if (it.length < 10) break;
    }
  } catch (e) {
    if (all.length === 0) {
      for (let p = 0; p < 5; p++) {
        const j = await spGet('https://api.spotify.com/v1/search', { q: 'artist:"' + c.name + '"', type: 'album', limit: '10', offset: String(p * 10) });
        const it = ((j.albums && j.albums.items) || []).filter(Boolean).filter(a => (a.artists || []).some(x => norm(x.name) === c.key));
        all.push(...it); if (!((j.albums && j.albums.items) || []).length) break;
      }
    }
  }
  return all.map(a => ({ id: a.id, title: a.name || '', year: String(a.release_date || '').slice(0, 4), type: a.album_type || 'album', cover: ((a.images || [])[1] || (a.images || [])[0] || {}).url || '' }));
}
async function dcAlbums(c) {
  let rows = [];
  for (let p = 1; p <= 3; p++) {
    const j = await getJSON('https://api.discogs.com/artists/' + c.dc + '/releases?' + new URLSearchParams({ per_page: '100', page: String(p), sort: 'year', sort_order: 'asc', token: dTok() }));
    rows = rows.concat(j.releases || []);
    if (!j.pagination || p >= j.pagination.pages) break;
  }
  const main = rows.filter(x => (x.role || 'Main') === 'Main');
  const masters = main.filter(x => x.type === 'master');
  return (masters.length ? masters : main).map(x => ({ id: x.id, title: x.title || '', year: String(x.year || ''), thumb: x.thumb || '' }));
}
async function wishDiscography(c) {
  const items = new Map();
  const put = (title, year, o) => {
    const k = norm(title); if (!k) return;
    const it = items.get(k);
    if (!it) items.set(k, { key: k, title: title.replace(/\s*[\(\[](deluxe|remaster|expanded|anniversary|bonus)[^\)\]]*[\)\]]\s*$/i, ''), year: year || '', artist: c.name, ...o });
    else { if (year && (!it.year || +year < +it.year)) it.year = year; for (const p in o) if (o[p] && !it[p]) it[p] = o[p]; }
  };
  const errs = [], jobs = [];
  if (c.sp && SP.tok()) jobs.push(spAlbums(c).then(l => l.forEach(a => put(a.title, a.year, { spotifyId: a.id, cover: a.cover, spType: a.type }))).catch(e => errs.push('Spotify: ' + spErrorText(e))));
  if (c.dc && dTok()) jobs.push(dcAlbums(c).then(l => l.forEach(a => put(a.title, a.year, { discogsId: String(a.id), thumb: a.thumb }))).catch(e => errs.push('Discogs failed')));
  await Promise.all(jobs);

}

  let d = document.getElementById('dbgbar');
  if (!d) { d = document.createElement('div'); d.id = 'dbgbar'; d.style.cssText = 'position:fixed;left:0;right:0;bottom:60px;z-index:99;background:#222;color:#0f0;padding:6px 10px;font:12px monospace;pointer-events:none'; document.body.appendChild(d); }
  const t = e.target; d.textContent = 'tap: ' + (t.tagName || '?') + (t.id ? '#' + t.id : '') + ' ' + [...(t.attributes || [])].filter(a => a.name.startsWith('data-')).map(a => a.name + '=' + a.value).join(' ');
}, true);
document.addEventListener('click', e => { try { onClickInner(e); } catch (err) { showErr(err); } });
function onClickInner(e) {
  const t = e.target;
  if (t.id === 'sheet') { closeSheet(); return; }
  if (t.id === 'tdet') { $('#tdet').classList.add('hide'); return; }
  if (t.closest('#tpop')) { popNext(); return; }
  const sl = t.closest('a[data-spid]');
  if (sl) {
    e.preventDefault();
    const web = sl.href;
    location.href = 'spotify:album:' + sl.dataset.spid;
    setTimeout(() => { if (!document.hidden) window.open(web, '_blank', 'noopener'); }, 1500);
    return;
  }
  if (t.closest('a.play')) return;
  const tab = t.closest('button[data-tab]'); if (tab) { setTab(tab.dataset.tab); return; }
  const th = t.closest('[data-theme-id]'); if (th) { applyTheme(th.dataset.themeId); const g = $('#theme-grid'); if (g) g.innerHTML = themeGridHTML(); return; }
  const vw = t.closest('[data-view]'); if (vw) { S.view = vw.dataset.view; lset('musicbox_view', S.view); renderLibrary(); return; }
  const pg = t.closest('[data-pg]'); if (pg) { S.page += +pg.dataset.pg; renderLibraryList(); toListTop(); return; }
  const tr = t.closest('[data-trophy]'); if (tr) { showTrophy(tr.dataset.trophy); return; }
  const chip = t.closest('[data-chip]'); if (chip) { S.filter = chip.dataset.chip; S.page = 0; $('#chips').innerHTML = chipsHTML(); renderLibraryList(); return; }
  const pick = t.closest('[data-pick]'); if (pick) { pickResult(+pick.dataset.pick); return; }
  const wc = t.closest('[data-wc]'); if (wc) { wishPick(+wc.dataset.wc); return; }
  const wa = t.closest('[data-wadd]'); if (wa) { wishAdd(wa.dataset.wadd); return; }
  const wo = t.closest('[data-wopen]'); if (wo) { openWish(wo.dataset.wopen); return; }
  const dp = t.closest('[data-dpick]'); if (dp) { discogsPick(+dp.dataset.dpick); return; }
  const open = t.closest('[data-open]'); if (open) { openRecord(open.dataset.open); return; }
  const b = t.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'add') openRecord(null);
  else if (act === 'scan') openScan();
  else if (act === 'scan-go') lookupBarcode(($('#scan-code') || {}).value || '');
  else if (act === 'spin') openSpin(false);
  else if (act === 'spin-again') openSpin(true);
  else if (act === 'bell') openBell();
  else if (act === 'cov-clear') { if (S.draft) { S.draft.cover = ''; updateCoverPrev(); } }
  else if (act === 'wish-search') wishSearch();
  else if (act === 'wd-back') { if (S.wd && S.wd.list) { S.wd = { phase: 'cands', list: S.wd.list, errs: [] }; } else S.wd = null; refreshWish(); }
  else if (act === 'wd-toggle') { S.wd.all = !S.wd.all; refreshWish(); }
  else if (act === 'wd-all') wishAddAll();
  else if (act === 'wish-got') wishGot();
  else if (act === 'wish-del') wishDel();
  else if (act === 'fill-dc') fillFromDiscogs();
  else if (act === 'fill-stop') S.stop = true;
  else if (act === 'dc-search') discogsSearch();
  else if (act === 'dtoken-save') { lset('musicbox_discogs_token', ($('#dtoken').value || '').trim()); toast('Saved'); renderSettings(); }
  else if (act === 'dtoken-clear') { lset('musicbox_discogs_token', ''); toast('Removed'); renderSettings(); }
  else if (act === 'close') closeSheet();
  else if (act === 'tclose') $('#tdet').classList.add('hide');
  else if (act === 'save') saveDraft();
  else if (act === 'delete') deleteDraft();
  else if (act === 'unlink') unlinkDraft();
  else if (act === 'sp-search') sheetSearch();
  else if (act === 'sp-connect') spConnect();
  else if (act === 'sp-disconnect') { SP.clear(); toast('Spotify disconnected'); renderSettings(); }
  else if (act === 'match-all') matchAll();
  else if (act === 'match-stop') S.stop = true;
  else if (act === 'export') exportJSON();
  else if (act === 'export-csv') exportCSV();
  else if (act === 'welcome') showWelcome();
  else if (act === 'ddhide') { lset('musicbox_hide_' + dayKey(new Date()), '1'); renderLibrary(); }
  else if (act === 'signout') { closeSheet(); fb.A.signOut(fb.auth); }
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sort') { S.sort = t.value; S.page = 0; renderLibraryList(); }
  else if (t.id === 'csv' && t.files[0]) importCSV(t.files[0]);
  else if (t.id === 'cov-file' && t.files[0]) { photoToCover(t.files[0]).then(u => { if (S.draft) { S.draft.cover = u; updateCoverPrev(); toast('Cover added. Save to keep it.'); } }).catch(() => toast('Could not read that picture')); }
  else if (t.matches && t.matches('[data-pp]')) { S.pp = +t.value || 50; lset('musicbox_pp', String(S.pp)); S.page = 0; if (S.tab === 'library') renderLibraryList(); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; S.page = 0; renderLibraryList(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'scan-code') { e.preventDefault(); lookupBarcode(e.target.value); }
  if (e.key === 'Enter' && e.target.id === 'wq') { e.preventDefault(); wishSearch(); }
  if (e.key === 'Enter' && e.target.id === 'dc-q') { e.preventDefault(); discogsSearch(); }
  if (e.key === 'Enter' && e.target.id === 'sp-q') { e.preventDefault(); sheetSearch(); }
  if (e.key === 'Escape') { closeSheet(); $('#tdet').classList.add('hide'); }
});
$('#btn-copy-uid').addEventListener('click', () => { navigator.clipboard && navigator.clipboard.writeText(S.user.uid).then(() => toast('Copied')); });
$('#btn-signin').addEventListener('click', async () => {
  $('#login-err').textContent = '';
  try { await fb.A.signInWithPopup(fb.auth, new fb.A.GoogleAuthProvider()); }
  catch (e) { if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') $('#login-err').textContent = 'Sign in failed. Allow pop ups for this site and try again.'; }
});

/* ====================================================================
   Start
   ==================================================================== */
(() => {
  const hdr = document.querySelector('header.top');
  const setHH = () => document.documentElement.style.setProperty('--hh', hdr.offsetHeight + 'px');
  if (window.ResizeObserver) new ResizeObserver(setHH).observe(hdr);
  window.addEventListener('resize', setHH);
  window.addEventListener('scroll', () => { const y = window.scrollY, c = document.body.classList; if (y > 90) c.add('scrolled'); else if (y < 30) c.remove('scrolled'); }, { passive: true });
})();
(async function main() {
  applyTheme(savedTheme());
  await spHandleRedirect();
  try { await fbInit(); } catch (e) { $('#loading').innerHTML = '<h1>Musicbox</h1><p>Could not load. Check your connection and reload.</p>'; return; }
  fb.A.onAuthStateChanged(fb.auth, u => {
    S.user = u;
    if (!u) { stopListening(); S.recs = []; show('login'); return; }
    show('loading'); startListening();
    if (S.pendingToast) { const m = S.pendingToast; S.pendingToast = ''; setTimeout(() => toast(m), 900); }
  });
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
