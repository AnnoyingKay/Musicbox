name: Collect listening

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node scripts/sync.mjs
        env:
          TZ: Europe/Dublin
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SPOTIFY_CLIENT_ID: 499c789232a643b9867579610a1b9e70
          UIDS: YNOKHAbSVxUudg94P7O7UjI5rOJ3,vsTUyNLMKpfJh1flUDzvOGynBz23
